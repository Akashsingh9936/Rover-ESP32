; Three build environments share the same board / libs / monitor setup.
; Pick which one to upload — each builds a different source file.
;
;   pio run -e esp32dev   -t upload  → src/main.cpp       (raw channel reader)
;   pio run -e esp32dac   -t upload  → src/main_dac.cpp   (CH3 → split DAC test)
;   pio run -e esp32rover -t upload  → src/main_rover.cpp (CH3+CH4 → DACs + relays)
;
; In VS Code: click the env name in the PlatformIO status bar (bottom) to switch.

[env]
platform      = espressif32
board         = esp32dev
framework     = arduino
lib_deps      = zz-cat/CRSFforArduino
monitor_speed = 115200

[env:esp32dev]
build_src_filter = +<main.cpp>

[env:esp32dac]
build_src_filter = +<main_dac.cpp>

[env:esp32rover]
build_src_filter = +<main_rover.cpp>
